# Testversion: jeder Push auf den Branch "testing" baut ein Image ghcr.io/<repo>:testing (+ :testing-<commit>).
# Die Version lautet dann z. B. 1.0.0-testing.ab12cd3 (im Admin-Bereich und unter /api/version zu sehen).
# Stabil bleibt main: Releases entstehen dort (siehe release.yml).
name: Testing

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: testing-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version setzen
        id: v
        run: |
          SHORT="${GITHUB_SHA::7}"
          V="$(tr -d ' \n' < VERSION)-testing.$SHORT"
          echo "$V" > VERSION
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:testing
            ghcr.io/${{ github.repository }}:testing-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=testing
          cache-to: type=gha,mode=max,scope=testing

      - name: Zusammenfassung
        run: echo "Testversion **${{ steps.v.outputs.version }}** → \`ghcr.io/${{ github.repository }}:testing\`" >> "$GITHUB_STEP_SUMMARY"
