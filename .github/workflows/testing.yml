# Testversion = Release Candidate: jeder Push auf den Branch "testing" baut ein Image ghcr.io/<repo>:testing
# (gleich auch :rc und :testing-<commit>). Die Version lautet z. B. 2.2.0-rc.7 (7 Commits seit dem letzten Release-Tag,
# tools/rc-version.sh), mit Kurz-SHA als Build-Kennung: im Admin-Bereich "2.2.0-rc.7 (1cc210f)", /api/version "build".
# Stabil bleibt main: Releases entstehen dort (siehe release.yml).
name: Testing

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: testing-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ganze Historie + Tags: rc.N = Commits seit dem letzten Release-Tag
          fetch-tags: true

      - name: Version setzen
        id: v
        run: |
          SHORT="${GITHUB_SHA::7}"
          FULL="$(sh tools/rc-version.sh "$GITHUB_SHA")"     # z. B. 2.2.0-rc.7+1cc210f
          echo "$FULL" > VERSION
          echo "version=${FULL%%+*}" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      # Gjallarhorn vorab pruefen: Fehler erscheinen als Annotationen (lesbar ohne Log-Zugriff)
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: gjallarhorn/go.sum
      - name: Gjallarhorn pruefen (vet, Kurztests)
        working-directory: gjallarhorn
        run: |
          set +e
          { go vet ./... && go test -short ./internal/...; } > "$RUNNER_TEMP/go.out" 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            { grep -E 'FAIL|panic|\.go:[0-9]+|error' "$RUNNER_TEMP/go.out" | head -25; tail -5 "$RUNNER_TEMP/go.out"; } \
              | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:testing
            ghcr.io/${{ github.repository }}:rc
            ghcr.io/${{ github.repository }}:testing-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=testing
          cache-to: type=gha,mode=max,scope=testing

      # Gjallarhorn-Knoten-Image (fuer externe Knoten per "Erweitern")
      - uses: docker/build-push-action@v6
        with:
          context: gjallarhorn
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:testing
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:testing-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=horn-testing
          cache-to: type=gha,mode=max,scope=horn-testing

      - name: Zusammenfassung
        run: echo "Release Candidate **${{ steps.v.outputs.version }}** (${{ steps.v.outputs.short }}) → \`ghcr.io/${{ github.repository }}:testing\` / \`:rc\`" >> "$GITHUB_STEP_SUMMARY"
