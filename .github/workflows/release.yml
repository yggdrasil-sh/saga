# Release: VERSION auf main erhoehen (+ Abschnitt in CHANGELOG.md) -> Tag v<VERSION>, Docker-Image
# (amd64 + arm64) nach ghcr.io und GitHub-Release mit den Notizen aus CHANGELOG.md.
# Alternativ ein Tag v1.2.3 pushen (muss zu VERSION passen). Gibt es das Tag schon, passiert nichts.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version pruefen
        id: v
        run: |
          V="$(tr -d ' \n' < VERSION)"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION ist kein SemVer: $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION ($V)"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V ist schon veroeffentlicht - nichts zu tun"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$V]"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Release-Notizen: Abschnitt dieser Version aus dem Changelog
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          # @Wort nicht als GitHub-Erwaehnung verlinken (sonst landen fremde Konten unter "Contributors")
          python3 tools/notes-entschaerfen.py < notes.md > notes.safe.md && mv notes.safe.md notes.md

      - name: Tag anlegen
        if: steps.v.outputs.skip != '1' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "Saga ${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.skip != '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != '1'

      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.v.outputs.skip != '1'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        if: steps.v.outputs.skip != '1'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gjallarhorn-Knoten-Image (fuer externe Knoten per "Erweitern")
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.skip != '1'
        with:
          context: gjallarhorn
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=horn
          cache-to: type=gha,mode=max,scope=horn

      # Gjallarhorn-Binaerdateien fuer Selbst-Updates der Knoten: bauen, mit dem Release-Schluessel signieren
      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != '1'
        with:
          go-version: '1.24'
          cache-dependency-path: gjallarhorn/go.sum
      - name: Gjallarhorn bauen und signieren
        if: steps.v.outputs.skip != '1'
        env:
          HORN_RELEASE_KEY: ${{ secrets.HORN_RELEASE_KEY }}
          V: ${{ steps.v.outputs.version }}
        run: |
          [ -n "$HORN_RELEASE_KEY" ] || { echo "::error::Secret HORN_RELEASE_KEY fehlt"; exit 1; }
          sh gjallarhorn/build.sh "$V"
          python3 -m pip install --quiet cryptography
          PUB="$(grep -v '^#' gjallarhorn/release.pub | tr -d ' \n')"
          for a in amd64 arm64; do
            python3 tools/horn-release.py sign "$V" "gjallarhorn/dist/gjallarhorn-linux-$a" >/dev/null
            python3 tools/horn-release.py verify "$PUB" "$V" "gjallarhorn/dist/gjallarhorn-linux-$a"
          done

      - name: GitHub-Release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --title "Saga ${{ steps.v.outputs.version }}" --notes-file notes.md --verify-tag \
            gjallarhorn/dist/gjallarhorn-linux-amd64 gjallarhorn/dist/gjallarhorn-linux-amd64.sig \
            gjallarhorn/dist/gjallarhorn-linux-arm64 gjallarhorn/dist/gjallarhorn-linux-arm64.sig \
            gjallarhorn/dist/SHA256SUMS
