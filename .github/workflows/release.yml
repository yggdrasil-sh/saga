# Release: Tag v1.2.3 pushen -> Docker-Image (amd64 + arm64) nach ghcr.io und GitHub-Release mit den
# Notizen aus CHANGELOG.md. Die Datei VERSION muss zum Tag passen.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version pruefen
        id: v
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d ' \n' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then echo "::error::Tag v$TAG passt nicht zu VERSION ($FILE)"; exit 1; fi
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$TAG]"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          # Release-Notizen: Abschnitt dieser Version aus dem Changelog
          awk -v v="$TAG" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Saga ${{ steps.v.outputs.version }}" --notes-file notes.md --verify-tag
