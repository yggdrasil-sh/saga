# Release: auf main traegt CHANGELOG.md fuer die Version aus VERSION einen Abschnitt mit echtem Datum
# ("## [x.y.z] – JJJJ-MM-TT", nicht 2026-XX-XX) -> Tag v<VERSION>, Docker-Image
# (amd64 + arm64) nach ghcr.io und GitHub-Release mit den Notizen aus docs/release-notes/<VERSION>.md bzw. CHANGELOG.md.
# VERSION darf schon auf der naechsten geplanten Version stehen: ohne Datum ist es eine Testversion (testing.yml).
# Alternativ ein Tag v1.2.3 pushen (muss zu VERSION passen). Gibt es das Tag schon, passiert nichts.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md, .github/workflows/release.yml]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version pruefen
        id: v
        run: |
          V="$(tr -d ' \r\n' < VERSION)"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION ist kein SemVer: $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION ($V)"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V ist schon veroeffentlicht - nichts zu tun"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && ! grep -Eq "^## \[$(printf '%s' "$V" | sed 's/\./\\./g')\] – [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::notice::CHANGELOG.md hat fuer $V noch kein Release-Datum - kein Release (Testversion: testing.yml)"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt [$V]"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Release-Notizen: docs/release-notes/<V>.md, falls vorhanden (kurze Fassung, z. B. Englisch + Deutsch),
          # sonst der Abschnitt dieser Version aus dem Changelog. Ueber 125 000 Zeichen lehnt GitHub ab (HTTP 422) -
          # notes-entschaerfen.py kuerzt deshalb an einer Zeilengrenze (2.5: [Unveroeffentlicht] hatte ~300 000 Zeichen).
          if [ -s "docs/release-notes/$V.md" ]; then
            cp "docs/release-notes/$V.md" notes.md
          else
            awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          fi
          # @Wort nicht als GitHub-Erwaehnung verlinken (sonst landen fremde Konten unter "Contributors")
          python3 tools/notes-entschaerfen.py < notes.md > notes.safe.md && mv notes.safe.md notes.md

      - name: Tag anlegen
        if: steps.v.outputs.skip != '1' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.v.outputs.version }}" -m "Saga ${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.skip != '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != '1'

      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.v.outputs.skip != '1'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
          # :latest, :<major>, :testing und :rc setzt der Schritt "Gleitende Tags" am Ende - nur, wenn main noch hier steht

      - uses: docker/build-push-action@v6
        if: steps.v.outputs.skip != '1'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gjallarhorn-Knoten-Image (fuer externe Knoten per "Erweitern")
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.skip != '1'
        with:
          context: gjallarhorn
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gjallarhorn:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=horn
          cache-to: type=gha,mode=max,scope=horn

      # Gjallarhorn-Binaerdateien fuer Selbst-Updates der Knoten: bauen, mit dem Release-Schluessel signieren
      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != '1'
        with:
          go-version: '1.24'
          cache-dependency-path: gjallarhorn/go.sum
      - name: Gjallarhorn bauen und signieren
        if: steps.v.outputs.skip != '1'
        env:
          HORN_RELEASE_KEY: ${{ secrets.HORN_RELEASE_KEY }}
          V: ${{ steps.v.outputs.version }}
        run: |
          [ -n "$HORN_RELEASE_KEY" ] || { echo "::error::Secret HORN_RELEASE_KEY fehlt"; exit 1; }
          sh gjallarhorn/build.sh "$V"
          python3 -m pip install --quiet cryptography
          PUB="$(grep -v '^#' gjallarhorn/release.pub | tr -d ' \n')"
          for a in amd64 arm64; do
            python3 tools/horn-release.py sign "$V" "gjallarhorn/dist/gjallarhorn-linux-$a" >/dev/null
            python3 tools/horn-release.py verify "$PUB" "$V" "gjallarhorn/dist/gjallarhorn-linux-$a"
          done

      - name: GitHub-Release
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --title "Saga ${{ steps.v.outputs.version }}" --notes-file notes.md --verify-tag \
            gjallarhorn/dist/gjallarhorn-linux-amd64 gjallarhorn/dist/gjallarhorn-linux-amd64.sig \
            gjallarhorn/dist/gjallarhorn-linux-arm64 gjallarhorn/dist/gjallarhorn-linux-arm64.sig \
            gjallarhorn/dist/SHA256SUMS

      # Gleitende Tags (Bugs-DB 2335): :latest, :<major>, :testing, :rc (Saga) und :latest, :testing (Knoten) zeigen auf das
      # Release - aber nur, wenn main noch auf diesem Commit steht. Ist main schon weiter, hat testing.yml des neueren
      # Commits sie gesetzt (bzw. setzt sie gleich); ein Zuruecksetzen auf das Release wuerde Server mit Autoupdate auf
      # einen aelteren Stand bringen (nach einer neueren Migration startet der nicht: SchemaTooNew).
      - name: Gleitende Tags (nur wenn main noch hier steht)
        if: steps.v.outputs.skip != '1'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          M="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$M" != "$GITHUB_SHA" ]; then
            echo "::notice::main ist schon weiter ($M) - gleitende Tags setzt testing.yml"; exit 0
          fi
          R="ghcr.io/$GITHUB_REPOSITORY"; H="ghcr.io/$GITHUB_REPOSITORY_OWNER/gjallarhorn"
          docker buildx imagetools create -t "$R:latest" -t "$R:${V%%.*}" -t "$R:testing" -t "$R:rc" "$R:$V"
          docker buildx imagetools create -t "$H:latest" -t "$H:testing" "$H:$V"
          echo "Gleitende Tags → $V (\`:latest\`, \`:${V%%.*}\`, \`:testing\`, \`:rc\`)" >> "$GITHUB_STEP_SUMMARY"
