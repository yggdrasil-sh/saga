#cloud-config
# Saga-Testlabor, Rolle A: Saga hinter Traefik, eingebauter Knoten per TLS-Durchreiche (SNI).
#   a.@@DOMAIN@@       -> Traefik (TLS, Let's Encrypt) -> saga:8080
#   horn-a.@@DOMAIN@@  -> Traefik TCP-Router, Durchreiche + PROXY v2 -> saga:8443 (eingebauter Knoten, nur TCP)
# Keine Geheimnisse hier: Passwoerter und Schluessel entstehen auf dem Server (/root/saga-test/zugang.txt).
# tools/testlab/testlab.py ersetzt @@DOMAIN@@ und @@CHANNEL@@ vor dem Anlegen.
package_update: true
packages: [ca-certificates, curl, jq, openssl]
write_files:
  - path: /opt/saga-test/saga/compose.testlab.yml
    permissions: "0644"
    content: |
      # Ergaenzung zur docker-compose.yml aus dem Saga-Repo (Testlabor Rolle A)
      services:
        traefik:
          image: docker.io/library/traefik:v3
          restart: unless-stopped
          command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.websecure.address=:443
            # http-01: mit tlschallenge beantwortet Traefik TLS-ALPN-01 selbst - auch fuer horn-a (Durchreiche),
            # der Knoten bekaeme dann nie ein Zertifikat
            - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
            - --certificatesresolvers.le.acme.storage=/le/acme.json
          ports: ["80:80", "443:443"]
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - traefik-le:/le
          networks: {default: {ipv4_address: 172.30.0.2}}
        saga:
          labels:
            - traefik.enable=true
            - traefik.http.routers.saga.rule=Host(`a.@@DOMAIN@@`)
            - traefik.http.routers.saga.entrypoints=websecure
            - traefik.http.routers.saga.tls.certresolver=le
            - traefik.http.routers.saga.service=saga
            - traefik.http.services.saga.loadbalancer.server.port=8080
            - traefik.tcp.routers.horn.rule=HostSNI(`horn-a.@@DOMAIN@@`)
            - traefik.tcp.routers.horn.entrypoints=websecure
            - traefik.tcp.routers.horn.tls.passthrough=true
            - traefik.tcp.routers.horn.service=horn
            - traefik.tcp.services.horn.loadbalancer.server.port=8443
            - traefik.tcp.services.horn.loadbalancer.proxyProtocol.version=2
      volumes:
        traefik-le:
      networks:
        default:
          # feste Adresse fuer Traefik (TRUSTED_PROXIES), die anderen Container bekommen Adressen ab .128 - sonst kann
          # db/saga beim Start 172.30.0.2 belegen und Traefik startet nicht ("Address already in use")
          ipam: {config: [{subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25}]}
  - path: /usr/local/sbin/saga-test-start
    permissions: "0755"
    content: |
      #!/bin/sh
      # Saga (Kanal @@CHANNEL@@) mit Traefik starten; .env nur beim ersten Lauf erzeugen.
      set -eu
      D=/opt/saga-test/saga; cd "$D"
      curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/yggdrasil-sh/saga/@@CHANNEL@@/docker-compose.yml
      if [ ! -f .env ]; then
        umask 077
        PW=$(openssl rand -base64 18 | tr -d '/+=')
        IP4=$(curl -fsS http://169.254.169.254/hetzner/v1/metadata/public-ipv4)
        cat > .env <<EOF
      BASE_URL=https://a.@@DOMAIN@@
      SECRET_KEY=$(openssl rand -hex 32)
      POSTGRES_PASSWORD=$(openssl rand -hex 24)
      ADMIN_USERNAME=admin
      ADMIN_PASSWORD=$PW
      HOST_BIND=127.0.0.1
      ADMIN_BIND=127.0.0.1
      TRUSTED_PROXIES=172.30.0.2
      SAGA_VERSION=@@CHANNEL@@
      TIMEZONE=Europe/Berlin
      COMPOSE_FILE=docker-compose.yml:compose.testlab.yml
      HORN_NAME=horn-a.@@DOMAIN@@
      HORN_PUBLIC_URL=https://horn-a.@@DOMAIN@@
      HORN_UDP=0
      HORN_PROXY_PROTOCOL=auto
      HORN_PUBLIC_IP=$IP4
      EOF
        mkdir -p /root/saga-test
        printf 'Saga A: https://a.@@DOMAIN@@\nAdmin (SSH-Tunnel: ssh -L 8081:127.0.0.1:8081 root@a.@@DOMAIN@@): admin / %s\n' "$PW" > /root/saga-test/zugang.txt
        chmod 600 /root/saga-test/zugang.txt
      fi
      docker compose pull -q
      docker compose up -d
runcmd:
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [sh, -c, "/usr/local/sbin/saga-test-start > /var/log/saga-test-start.log 2>&1 && mkdir -p /var/lib/saga-test && date -Is > /var/lib/saga-test/ready || touch /var/lib/saga-test-failed"]
