# Saga
# Start:  cp .env.example .env  &&  .env ausfuellen  &&  docker compose up -d --build
#
# Hauptseite: Port 8080 (HOST_PORT) - hinter einen Reverse Proxy mit HTTPS stellen, der WebSocket durchreicht (Nginx Proxy
#   Manager: "Websockets Support"); ab 2.5 laufen auch Anrufe ueber diese Adresse. Oder ab 2.5 "Ein Name, ein Port":
#   Saga nimmt HTTPS auf 443 selbst an (SAGA_TLS=1, siehe unten bei ports und ANLEITUNG Abschnitt 3).
# Admin-Bereich: Port 8081 (ADMIN_PORT) - standardmaessig NUR auf 127.0.0.1 (ADMIN_BIND),
#   z. B. per SSH-Tunnel oeffnen: ssh -L 8081:127.0.0.1:8081 server  ->  http://localhost:8081
# Websuche (SearXNG) ist optional: COMPOSE_PROFILES=search in der .env.

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-saga}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # bewusst KEIN "ports:" - nur Saga spricht mit der Datenbank
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  saga:
    # Fertiges Image von GitHub. SAGA_VERSION in .env: "2" = jeder neue Stand von main (Standard; bis 3.0 ein Kanal,
    # jeder Stand eine Beta), "2.5" = nur Releases 2.5.x, "2.5.0" = genau dieses Release (Festnageln nur, solange keine
    # neuere Version die Datenbank umgebaut hat - ANLEITUNG Abschnitt 11). Selbst bauen: docker compose build.
    image: ghcr.io/yggdrasil-sh/saga:${SAGA_VERSION:-2}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      # IPv6-Besucher bei reinem IPv4-Docker-Netz: der Userland-Proxy von Docker ersetzt ihre Adresse durch das Gateway
      # (alle teilen sich die Fehlversuch-Bremse) - Reverse Proxy auf dem Host oder IPv6 im Docker-Netz (ANLEITUNG Abschnitt 3)
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-8080}:8080"
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_HOST_PORT:-8081}:8081"
      # 2.5 "Ein Name, ein Port" (SAGA_TLS=1 in .env, ANLEITUNG Abschnitt 3): Saga nimmt HTTPS selbst an, Anrufe laufen
      # ueber denselben Port - ohne Proxy:
      # - "443:443/tcp"
      # - "443:443/udp"          # optional, schnellere Anrufe (dieselbe Nummer)
      # hinter einem Proxy mit TLS-Durchreiche + PROXY-Kopf (TLS_PROXY_PROTOCOL=1, nicht bei NPM mit eigenem Zertifikat)
      # nur fuer den Proxy, z. B.:
      # - "100.64.0.10:8443:443/tcp"
      # 8080 bleibt fuer den Healthcheck und als Rueckweg; dann nicht nach aussen veroeffentlichen (HOST_BIND=127.0.0.1).
      # 2.5 Gjallarhorn (Feature-Flag calls.horn): Hinter einem Reverse Proxy, der TLS selbst beendet (z. B. Nginx Proxy
      # Manager mit "Websockets Support"), braucht der eingebaute Knoten KEINEN weiteren Port und keinen eigenen Namen:
      # Er laeuft im Tunnel-Betrieb ueber die Saga-Adresse (eine Domain, nur 443 am Proxy, hier nur 8080; /api/sfu/ws,
      # docs/UPGRADE-2.5.md und ANLEITUNG Abschnitt 3). Die folgenden Zeilen sind nur fuer Sonderfaelle.
      # Optional UDP 443 fuer etwas bessere Anrufe (HORN_UDP_LISTEN=:443 in .env; NPM belegt nur TCP 443) - ein
      # zusaetzlich geoeffneter Port, nicht noetig:
      # - "443:443/udp"
      # Nur wenn der eingebaute Knoten bewusst einen eigenen Namen bekommt (HORN_PORT, Standard 8443; TLS-Durchreiche
      # per SNI am Proxy oder Portfreigabe, ANLEITUNG "Eingebauter Knoten hinter einem L4-Proxy"):
      # - "${HORN_BIND:-0.0.0.0}:${HORN_HOST_PORT:-8443}:8443/tcp"
      # UDP geht dann NICHT durch die TLS-Durchreiche - direkt freigeben, auf dem Host mit DERSELBEN Nummer wie HORN_PORT
      # (der Knoten nennt den Geraeten diesen Port als Kandidaten). Ohne UDP laufen Anrufe ueber TCP/TLS bzw. den Tunnel.
      # - "${HORN_BIND:-0.0.0.0}:8443:8443/udp"
      # Hinter einer TLS-Durchreiche auf dem Proxy-Host sysctl net.ipv4.tcp_notsent_lowat=16384 setzen (gjallarhorn/NODE.md)
    # Optional Node64 (ipv64.net, Reverse Proxy PROXY64; ANLEITUNG Abschnitt 3 "Saga hinter Node64"): Node64 legt den
    # Proxy-Host aus diesen Labels selbst an (WebSockets an), wenn dort PROXY64 -> Docker -> "Docker-Labels auswerten"
    # an ist und Node64 die Docker-API sieht; das Zertifikat fuer solche Hosts dort ebenfalls waehlen (sonst nur ein
    # schon vorhandenes passendes, z. B. Wildcard). Node64 erreicht Saga im selben Docker-Netz auf Port 8080 - dann
    # HOST_BIND=127.0.0.1 und TRUSTED_PROXIES auf Node64 bzw. dieses Netz setzen. Domain anpassen:
    # labels:
    #   - node64.proxy.host=saga.example.org
    #   - node64.proxy.port=8080
    #   - node64.proxy.network=saga_default   # nur noetig, wenn Saga in mehreren Docker-Netzen haengt
    volumes:
      - saga-data:/data      # Dateien/Bilder der Seiten, Symbol-Cache
      - ./certs:/certs:ro          # optionale CA-Zertifikate (eigene LDAP-/SSO-/Kalender-Server)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  searxng:
    image: docker.io/searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  db-data:
  saga-data:
