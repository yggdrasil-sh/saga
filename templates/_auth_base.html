<!doctype html>
<html lang="{{ lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f141c">
<meta name="robots" content="noindex">
<title>{% block pagetitle %}{{ _("Anmelden") }}{% endblock %} – {{ title }}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg?v={{ v }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{ v }}">
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><img src="/static/icon.svg?v={{ v }}" alt="" width="44" height="44"><h1>{{ title }}</h1></div>
    {% block content %}{% endblock %}
  </div>
  {#- Sprache vor der Anmeldung waehlen (fremder Rechner): Cookie nur mit der Sprache, siehe saga.core.lang_switch #}
  {% block langsw %}{{ lang_switch("auth-lang") }}{% endblock %}
</main>
<script src="/static/lang.js?v={{ v }}"></script>
</body>
</html>
